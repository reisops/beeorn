
services:
  influxdb:
    image: docker.io/library/influxdb:2.7
    container_name: beeorn-influxdb
    ports:
      - "8086:8086"
    env_file: .env
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN}
    volumes:
      - influxdb-data:/var/lib/influxdb2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: docker.io/grafana/grafana:11.0.0
    container_name: beeorn-grafana
    env_file: .env
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:Z
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped

  mosquitto:
    image: docker.io/eclipse-mosquitto:2.0
    container_name: beeorn-mosquitto
    security_opt:
      - label=disable
    entrypoint: ["mosquitto"]
    command: ["-c", "/mosquitto/config/mosquitto.conf"]
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto-runtime/config:/mosquitto/config:ro
      - ./mosquitto-runtime/data:/mosquitto/data
      - ./mosquitto-runtime/log:/mosquitto/log
    restart: unless-stopped

  simulator:
    build: ./simulator
    container_name: beeorn-simulator
    env_file: .env
    environment:
      MQTT_USERNAME: beeorn
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      HIVE_ID: hive-01
    depends_on:
      mosquitto:
        condition: service_started
    restart: unless-stopped

  simulator-2:
    build: ./simulator
    container_name: beeorn-simulator-2
    env_file: .env
    environment:
      MQTT_USERNAME: beeorn
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      HIVE_ID: hive-02
    depends_on:
      mosquitto:
        condition: service_started
    restart: unless-stopped

  ingestor:
    build: ./ingestor
    container_name: beeorn-ingestor
    env_file: .env
    environment:
      MQTT_USERNAME: beeorn
      MQTT_PASSWORD: ${MQTT_PASSWORD}
    depends_on:
      mosquitto:
        condition: service_started
      influxdb:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: ./api
    container_name: beeorn-api
    env_file: .env
    ports:
      - "5000:5000"
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./web
    container_name: beeorn-web
    ports:
      - "8000:8000"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  influxdb-data:
  grafana-data:
